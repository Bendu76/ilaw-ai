<!DOCTYPE html>
<html>

<head>

  <title>Buy Credits</title>

  <style>

    body{

      font-family: Arial;
      text-align: center;
      padding: 40px;

    }

    .box{

      width: 400px;
      margin: auto;
      padding: 30px;
      border: 1px solid #ccc;
      border-radius: 10px;

    }

    img{

      width: 250px;
      margin-top: 20px;

    }

    button{

      padding: 12px 20px;
      margin-top: 20px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;

    }

  </style>

</head>

<body>

  <div class="box">

    <h1>Buy Credits</h1>

    <h2>
      ₱99 = 50 Generates
    </h2>

    <p>
      Scan the GCash QR Code below
    </p>

    <img
      src="gcash.jpg"
      alt="GCash QR">

    <h3>
      GCash Number:
      09XXXXXXXXX
    </h3>

    <p>
      After payment,
      send screenshot to admin.
    </p>

    <button
      onclick="window.location.href='index.html'">

      Back to Generator

    </button>

  </div>

</body>

</html>

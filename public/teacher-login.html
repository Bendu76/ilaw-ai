<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Teacher Login</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="container">

<h1>Teacher Login</h1>

<div class="form">

<input
  type="email"
  id="email"
  placeholder="Email Address">

<input
  type="password"
  id="password"
  placeholder="Password">

<button
  type="button"
  onclick="login()">

  Login

</button>

<p style="text-align:center;">

Don't have an account?

<a href="teacher-register.html">
Register Here
</a>

</p>

</div>

</div>

<script src="script.js"></script>

</body>

</html>

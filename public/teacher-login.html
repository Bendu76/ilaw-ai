<!DOCTYPE html>
<html>

<head>
  <title>Teacher Login</title>
</head>

<body>

  <h1>Teacher Login</h1>

  <input
    type="email"
    id="email"
    placeholder="Email">

  <br><br>

  <input
    type="password"
    id="password"
    placeholder="Password">

  <br><br>

  <button
    type="button"
    onclick="login()">
    Login
  </button>

  <script src="script.js"></script>

</body>

</html>

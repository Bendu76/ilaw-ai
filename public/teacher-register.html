<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Teacher Registration</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="container">

<h1>Teacher Registration</h1>

<div class="form">

<input
  type="text"
  id="fullname"
  placeholder="Full Name">

<input
  type="email"
  id="email"
  placeholder="Email Address">

<input
  type="password"
  id="password"
  placeholder="Password">

<button
  type="button"
  onclick="register()">

  Register

</button>

<p style="text-align:center;">

Already have an account?

<a href="teacher-login.html">
Login Here
</a>

</p>

</div>

</div>

<script src="script.js"></script>

</body>

</html>

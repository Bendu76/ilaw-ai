<!DOCTYPE html>
<html>

<head>

  <title>Admin Panel</title>

  <style>

    body{
      font-family: Arial;
      padding: 20px;
    }

    table{
      width: 100%;
      border-collapse: collapse;
    }

    th, td{
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    button{
      padding: 8px 15px;
      cursor: pointer;
    }

  </style>

</head>

<body>

  <h1>Admin Dashboard</h1>

  <table>

    <thead>

      <tr>

        <th>Name</th>
        <th>Email</th>
        <th>Credits</th>
        <th>Action</th>

      </tr>

    </thead>

    <tbody id="usersTable">

    </tbody>

  </table>



<script>

async function loadUsers() {

  const response =
    await fetch(
      "http://127.0.0.1:3000/auth/users"
    );

  const users =
    await response.json();

  let rows = "";

  users.forEach((user) => {

    rows += `

      <tr>

        <td>${user.fullname}</td>

        <td>${user.email}</td>

        <td>${user.credits}</td>

        <td>

          <button onclick="addCredits('${user._id}')">

            +50 Credits

          </button>

        </td>

      </tr>

    `;

  });

  document.getElementById(
    "usersTable"
  ).innerHTML = rows;

}



async function addCredits(id) {

  const response =
    await fetch(

      "http://127.0.0.1:3000/auth/add-credits/" + id,

      {
        method: "PUT"
      }

    );

  const data =
    await response.json();

  alert(data.message);

  loadUsers();

}



loadUsers();

</script>

</body>

</html>
